<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Cogis &middot; in development</title>
    <!--
    Cogis M8 web surface — placeholder page.

    This file is deliberately minimal. It exists so GitHub Pages can serve
    `https://cogis.ai/` with a valid TLS cert while the M8 bridge protocol
    is being designed and proven (see docs/agent_blueprint-m8-web-surface.md
    and docs/spikes/s8-1-postmessage-handshake-contract.md).

    Do NOT add:
      - Product surface language ("search across AI labs", branded UX, etc.)
      - The postMessage bridge implementation
      - Any fetch/XHR/WebSocket/import from a non-origin URL
      - Cookies, localStorage writes, or analytics
      - Third-party scripts of any kind

    Those all land in M8b through M8e per the M8 addendum.

    CSP below is intentionally strict: nothing may load off-origin and
    nothing may fetch. This will be re-tightened again in M8b once the
    real page ships.
  -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    />
    <style>
      :root {
        color-scheme: light dark;
        --fg: #1a1a1a;
        --fg-muted: #6b6b6b;
        --bg: #fafafa;
        --accent: #d97706;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #ededed;
          --fg-muted: #9a9a9a;
          --bg: #111;
          --accent: #f59e0b;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background: var(--bg);
        color: var(--fg);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        line-height: 1.5;
      }
      main {
        max-width: 32rem;
        text-align: center;
      }
      .banner {
        display: inline-block;
        padding: 0.375rem 0.875rem;
        margin-bottom: 1.5rem;
        border: 1px solid var(--accent);
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--accent);
      }
      h1 {
        font-size: 2.25rem;
        font-weight: 300;
        letter-spacing: -0.02em;
        margin: 0 0 1rem 0;
      }
      p {
        margin: 0.5rem 0;
        color: var(--fg-muted);
        font-size: 1rem;
      }
      footer {
        margin-top: 2rem;
        font-size: 0.75rem;
        color: var(--fg-muted);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="banner" role="status" aria-label="Development status">In development</div>
      <h1>Cogis</h1>
      <p>This site is under active development.</p>
      <p>Check back later.</p>
      <footer>
        <span aria-hidden="true">&mdash;</span>
      </footer>
    </main>
  </body>
</html>
