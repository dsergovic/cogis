<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cogis — AI Search</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Cogis</h1>
    </header>
    <form id="search-form">
      <input
        id="query-input"
        type="text"
        placeholder="Search your conversation history…"
        autocomplete="off"
      />
    </form>
    <p id="empty-hint" class="hint">Type a query and press Enter.</p>
    <div id="results" role="region" aria-label="Search results"></div>
    <p id="footnote" class="footnote" hidden></p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
