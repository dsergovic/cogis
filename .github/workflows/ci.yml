# Job name `build-and-test` is the GitHub status check context.
# After this workflow has gone green on a PR, add that context under
# Settings → Rules → Protect dev and main → Require status checks to pass.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

  # Addendum §6 M8b AC #12 names this job as the enforcement point for the
  # static site: CSP meta exact, no off-origin <script src> / <link href>,
  # CNAME contents, and the page's structural sanity. The checks live in the
  # vitest files so they also run locally; this job exists so the named status
  # check exists. Adding it to branch protection is a repo-settings change.
  web-build-and-check:
    name: web-build-and-check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Web surface checks
        run: npm run test:web
